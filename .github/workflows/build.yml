# On every push to main: build the site image, push it to GitHub Container
# Registry, then pin the new tag in k8s/kustomization.yaml. Flux sees that
# commit and rolls it out to the cluster.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"      # the tag-bump commit below must not retrigger this
      - "flux/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write     # push the tag-bump commit
  packages: write     # push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (ghcr needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ribbonboundlab" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3      # lets amd64 runners build arm64 (Raspberry Pi)
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Pin new tag for Flux
        run: |
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${GITHUB_SHA::7}"
          git push
