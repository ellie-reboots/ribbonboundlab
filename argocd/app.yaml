# Tells Argo CD to keep the cluster in sync with k8s/ in this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ribbonboundlab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ellie-reboots/ribbonboundlab.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ribbonboundlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
