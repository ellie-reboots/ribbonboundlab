# Homepage at / : stock nginx image + the files in deploy/site from a ConfigMap
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels: { app: homepage }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: homepage }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: homepage }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: homepage }
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 20m, memory: 24Mi }
            limits: { cpu: 250m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: site, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: site
          configMap: { name: homepage-site }
        - name: nginx-conf
          configMap: { name: homepage-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  labels: { app: homepage }
spec:
  selector: { app: homepage }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: homepage
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: homepage }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: homepage
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: homepage }
