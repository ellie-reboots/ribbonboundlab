apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: website

resources:
  - namespace.yaml
  - homepage.yaml
  - trainer.yaml
  - ingress.yaml

# No custom images: pages and nginx configs ship as ConfigMaps on top of the stock nginx image.
# Generated names include a content hash, so editing a page and re-applying rolls that app's pods automatically.
# The trainer page lives outside this folder, so render with:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s | kubectl apply -f -
configMapGenerator:
  - name: homepage-site
    files:
      - index.html=../site/index.html
  - name: homepage-nginx
    files:
      - default.conf=../homepage-nginx.conf
  - name: trainer-site
    files:
      - index.html=../../voice-trainer.html
  - name: trainer-nginx
    files:
      - default.conf=../trainer-nginx.conf
