# Voice Pitch Trainer, served under /voice/ (the page is mounted at /usr/share/nginx/html/voice/index.html)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/css application/javascript;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /voice {
        return 301 /voice/;
    }

    location /voice/ {
        # Always revalidate so new versions show up right after a rollout
        add_header Cache-Control "no-cache" always;
        # Only this app may ask for the microphone
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://discord.com https://discordapp.com https://ptb.discord.com https://canary.discord.com; img-src 'self' data: blob:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /voice/index.html;
    }

    location / {
        return 404;
    }
}
