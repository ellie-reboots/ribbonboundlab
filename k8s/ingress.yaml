# Routes ribbonboundlab.com to the site through the lab's Traefik.
# The shared Cloudflare Tunnel in kintsugi-lab sends traffic to Traefik.
# /api/stats goes to the read-only stats service; everything else to nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: ribbonboundlab
spec:
  ingressClassName: traefik
  rules:
    - host: ribbonboundlab.com
      http:
        paths:
          - path: /api/stats
            pathType: Exact
            backend:
              service:
                name: stats
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: www.ribbonboundlab.com
      http:
        paths:
          - path: /api/stats
            pathType: Exact
            backend:
              service:
                name: stats
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
