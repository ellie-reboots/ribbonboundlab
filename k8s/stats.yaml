# Tiny read-only API behind ribbonboundlab.com/api/stats (see stats.py).
# Talks to Prometheus inside the cluster; only aggregate numbers go out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats
  namespace: ribbonboundlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats
  template:
    metadata:
      labels:
        app: stats
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: stats
          image: python:3.12-alpine
          command: ["python", "-u", "/app/stats.py"]
          ports:
            - containerPort: 8080
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.monitoring.svc:9090
          readinessProbe:
            tcpSocket:
              port: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: stats-app
---
apiVersion: v1
kind: Service
metadata:
  name: stats
  namespace: ribbonboundlab
spec:
  selector:
    app: stats
  ports:
    - port: 80
      targetPort: 8080
