# Replaces nginx-unprivileged's default.conf (non-root, port 8080)
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Pages: browsers check for a newer version on every visit, so updates
    # show up right away. Unchanged pages still come back as a quick 304.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Images, the stylesheet (versioned on each build) and scripts: cache for a day
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
}
