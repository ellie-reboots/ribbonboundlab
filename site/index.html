<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ribbon Bound Lab</title>
  <style>
    :root { --bg: #fdf6f9; --fg: #2b2230; --accent: #d6457a; --muted: #7a6a80; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17121b; --fg: #f3e9f5; --accent: #ff7aa8; --muted: #a998ae; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 16px;
    }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: clamp(2rem, 8vw, 3.25rem); margin: 0 0 .25em; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); line-height: 1.6; }
    nav { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem; }
    nav a {
      color: var(--fg); text-decoration: none; padding: .5em 1em;
      border: 2px solid var(--accent); border-radius: 999px;
    }
    nav a:hover { background: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <h1>Ribbon <span>Bound</span> Lab</h1>
    <p>Pup, fox, vtuber-in-progress and homelab tinkerer.<br>Self-hosted with love on Kubernetes. 🎀🐾</p>
    <nav>
      <a href="#">Streams</a>
      <a href="#">Art</a>
      <a href="#">Lab</a>
    </nav>
  </main>
</body>
</html>
